<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prof. Apostrof — Dilbilgisi Antrenörü</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;0,9..144,900;1,9..144,400&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;0,9..144,900;1,9..144,400&family=Sora:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b14;
  --s1:#0f1420;
  --s2:#161d2e;
  --s3:#1e2840;
  --s4:#263350;
  --chalk:#f4f0e4;
  --amber:#f59e0b;
  --ember:#e07b00;
  --teal:#0d9488;
  --teal2:#14b8a6;
  --red:#dc2626;
  --green:#059669;
  --green2:#10b981;
  --sky:#3b82f6;
  --violet:#7c3aed;
  --text:#e8eaf6;
  --muted:#64748b;
  --muted2:#94a3b8;
  --border:rgba(255,255,255,.06);
  --border2:rgba(255,255,255,.12);
  --r:16px;
  --r2:10px;
  --shadow:0 4px 24px rgba(0,0,0,.45);
  --shadow2:0 8px 40px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Sora',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
/* Ambient background grid */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(245,158,11,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(245,158,11,.03) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(13,148,136,.1) 0%,transparent 65%),
             radial-gradient(ellipse 50% 40% at 100% 100%,rgba(245,158,11,.06) 0%,transparent 60%);
  pointer-events:none;
}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:max(40px,env(safe-area-inset-bottom))}

/* ─── TOPBAR ─── */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:max(13px,env(safe-area-inset-top)) 18px 11px;
  padding-left:max(18px,env(safe-area-inset-left));
  padding-right:max(18px,env(safe-area-inset-right));
  background:linear-gradient(180deg,rgba(8,11,20,.98) 0%,rgba(8,11,20,.6) 100%);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--border2);
}
.streak{
  display:flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,rgba(224,123,0,.2),rgba(245,158,11,.1));
  border:1px solid rgba(245,158,11,.35);
  border-radius:20px;padding:5px 11px;
  font-size:13px;font-weight:700;color:var(--amber);
  letter-spacing:.3px;
}
.xpbar-wrap{flex:1}
.xpbar-lbl{font-size:11px;color:var(--muted2);margin-bottom:4px;display:flex;justify-content:space-between;font-weight:500}
.xpbar{height:6px;background:var(--s4);border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.xpbar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--teal2),var(--amber));
  border-radius:3px;
  transition:width .7s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px rgba(245,158,11,.4);
}
.lvbadge{
  font-size:12px;font-weight:700;color:var(--amber);
  background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(224,123,0,.08));
  border:1px solid rgba(245,158,11,.3);
  border-radius:12px;padding:4px 10px;white-space:nowrap;
}

/* ─── HOME ─── */
.home-hero{display:flex;flex-direction:column;align-items:center;padding:20px 20px 6px}
.bubble{
  position:relative;
  background:linear-gradient(135deg,var(--s2),var(--s1));
  border:1px solid var(--border2);
  border-radius:0 18px 18px 18px;
  padding:13px 17px;margin:0 18px 20px;
  font-size:14px;line-height:1.7;color:var(--chalk);
  animation:fadeUp .4s ease;
  box-shadow:var(--shadow);
}
.bubble::before{
  content:'';position:absolute;top:-1px;left:-1px;
  border:8px solid transparent;
  border-right-color:var(--border2);
  border-bottom-color:var(--border2);
}
.eyebrow{
  font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;
  color:var(--teal2);text-align:center;margin-bottom:4px;
}
.apptitle{
  font-family:'Fraunces',serif;font-size:26px;font-weight:900;
  text-align:center;margin-bottom:24px;color:var(--chalk);
  letter-spacing:-.5px;
}
.apptitle span{color:var(--amber);font-style:italic}

/* ─── TOPIC ROWS ─── */
.topic-section{margin-bottom:8px;padding:0 16px}
.topic-hdr{
  background:linear-gradient(135deg,var(--s2),var(--s1));
  border:1px solid var(--border2);
  border-left:3px solid var(--tc,var(--border2));
  border-radius:var(--r);
  padding:16px;cursor:pointer;
  display:flex;align-items:center;gap:13px;
  transition:all .22s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow);
}
.topic-hdr:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow2);
  border-color:var(--tc,var(--border2));
  background:linear-gradient(135deg,var(--s3),var(--s2));
}
.t-emoji{font-size:28px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.t-meta{flex:1}
.t-name{font-size:14px;font-weight:700;color:var(--chalk);margin-bottom:3px;letter-spacing:-.2px}
.t-sub{font-size:11px;color:var(--muted2)}
.t-dots{display:flex;gap:4px;margin-top:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s4);border:1px solid var(--border2);transition:all .3s}
.dot.done{background:var(--tc,var(--green2));border-color:transparent;box-shadow:0 0 6px var(--tc,var(--green2))}
.dot.partial{background:rgba(245,158,11,.5);border-color:rgba(245,158,11,.4)}
.topic-chevron{font-size:16px;color:var(--muted);transition:transform .2s}
.topic-hdr.open .topic-chevron{transform:rotate(90deg)}

.stlist{
  background:var(--s1);
  border:1px solid var(--border2);
  border-top:none;
  border-radius:0 0 var(--r) var(--r);
  overflow:hidden;display:none;
  box-shadow:var(--shadow);
}
.strow{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:all .18s;
}
.strow:last-child{border-bottom:none}
.strow:hover:not(.locked){background:rgba(255,255,255,.03)}
.strow:hover:not(.locked) .strow-title{color:var(--amber)}
.strow.locked{opacity:.3;cursor:not-allowed}
.strow-icon{font-size:19px;flex-shrink:0}
.strow-info{flex:1}
.strow-title{font-size:13px;font-weight:600;color:var(--chalk);transition:color .18s}
.strow-status{font-size:11px;color:var(--muted2);margin-top:2px}
.strow-arrow{font-size:14px;color:var(--muted)}

/* ─── SUBTOPIC DETAIL ─── */
.stdetail-hero{padding:20px 20px 16px;text-align:center}
.stdetail-emoji{font-size:52px;margin-bottom:10px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.stdetail-title{font-family:'Fraunces',serif;font-size:26px;font-weight:900;color:var(--chalk);letter-spacing:-.5px}
.stdetail-parent{font-size:12px;color:var(--muted2);margin-top:5px;font-weight:500}

.prof-quote{
  background:linear-gradient(135deg,var(--s2),var(--s1));
  border:1px solid var(--border2);
  border-left:3px solid var(--teal2);
  border-radius:var(--r);
  padding:14px 18px;margin:0 16px 22px;
  font-size:13px;line-height:1.75;color:var(--chalk);
  font-style:italic;box-shadow:var(--shadow);
}

/* ─── LEVEL PATH ─── */
.level-path{padding:0 16px;display:flex;flex-direction:column}
.level-node{display:flex;align-items:flex-start;gap:14px;padding:0 0 22px}
.level-spine{display:flex;flex-direction:column;align-items:center}
.level-circle{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
  border:2px solid var(--border2);
  background:var(--s3);
  cursor:pointer;
  transition:all .22s cubic-bezier(.4,0,.2,1);
  position:relative;
  box-shadow:var(--shadow);
}
.level-circle.unlocked{
  background:linear-gradient(135deg,var(--lc,var(--teal)) 0%,color-mix(in srgb,var(--lc,var(--teal)) 70%,#000) 100%);
  border-color:var(--lc,var(--teal2));
  box-shadow:0 0 20px color-mix(in srgb,var(--lc,var(--teal)) 40%,transparent);
}
.level-circle.unlocked:hover{
  transform:scale(1.12) translateY(-2px);
  box-shadow:0 6px 28px color-mix(in srgb,var(--lc,var(--teal)) 50%,transparent);
}
.level-circle.unlocked:active{transform:scale(.96)}
.level-circle.complete{
  background:linear-gradient(135deg,var(--green),var(--green2));
  border-color:var(--green2);
  box-shadow:0 0 20px rgba(16,185,129,.35);
}
.level-circle.locked-c{opacity:.25;cursor:not-allowed}
.level-line{
  width:2px;flex:1;min-height:22px;
  background:linear-gradient(180deg,var(--border2),var(--border));
  margin:4px 0;
}
.level-info{flex:1;padding-top:10px}
.level-label{font-size:14px;font-weight:700;color:var(--chalk);margin-bottom:3px;letter-spacing:-.2px}
.level-desc{font-size:12px;color:var(--muted2);line-height:1.5}
.level-badge-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.level-chip{
  font-size:10px;font-weight:600;
  background:var(--s4);border:1px solid var(--border2);
  border-radius:20px;padding:3px 9px;color:var(--muted2);
  font-family:'Syne Mono',monospace;letter-spacing:.3px;
}
.level-chip.active{
  background:rgba(245,158,11,.12);
  border-color:rgba(245,158,11,.3);
  color:var(--amber);
}
.level-progress{font-size:11px;color:var(--muted2);margin-top:5px;font-weight:500}

/* ─── LESSON ENGINE ─── */
.lesson-hdr{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
}
.lesson-prog{flex:1}
.lesson-bar{
  height:7px;background:var(--s4);
  border-radius:4px;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.4);
}
.lesson-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.lesson-step{font-size:11px;color:var(--muted2);margin-top:4px;text-align:center;font-weight:500}
.retry-pill{
  background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);
  border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;color:var(--amber);
}
.back-btn{
  display:flex;align-items:center;gap:6px;
  cursor:pointer;color:var(--muted2);font-size:13px;font-weight:600;
  transition:color .18s;flex-shrink:0;
}
.back-btn:hover{color:var(--chalk)}

/* ─── RULE CARD ─── */
.rule-card{
  background:linear-gradient(135deg,rgba(13,148,136,.12),rgba(59,130,246,.06));
  border:1px solid rgba(13,148,136,.22);
  border-left:3px solid var(--teal2);
  border-radius:var(--r);
  padding:13px 16px;margin:0 16px 13px;
  font-size:13px;line-height:1.7;color:var(--chalk);
  box-shadow:var(--shadow);
}
.rule-card strong{color:var(--teal2)}
.rule-card em{color:var(--amber);font-style:normal}
.rule-tag{
  display:inline-block;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--teal2);
  background:rgba(13,148,136,.15);
  border-radius:6px;padding:2px 8px;margin-bottom:8px;
  font-family:'Syne Mono',monospace;
}
.rule-example{
  background:rgba(0,0,0,.35);
  border-radius:8px;padding:8px 11px;margin-top:9px;
  font-family:'Syne Mono',monospace;font-size:12px;
  color:var(--sky);line-height:1.8;
  border-left:2px solid rgba(59,130,246,.3);
}

/* ─── Q CARD ─── */
.q-card{
  background:linear-gradient(160deg,var(--s2),var(--s1));
  border:1px solid var(--border2);
  border-radius:var(--r);padding:18px;
  margin:0 16px 13px;
  box-shadow:var(--shadow);
}
.q-text{font-size:15px;font-weight:600;line-height:1.65;margin-bottom:15px;color:var(--chalk);user-select:none;-webkit-user-select:none}
.q-text strong{color:var(--amber)}
.q-text u{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px}
.rule-card u{text-decoration:underline;text-decoration-offset:3px}
.hint{font-size:12px;color:var(--amber);opacity:.75;margin-bottom:9px;font-weight:500}

/* ─── CHOICES ─── */
.choices{display:flex;flex-direction:column;gap:8px}
.ch{
  background:var(--s3);
  border:2px solid var(--border2);
  border-radius:var(--r2);
  padding:12px 14px;
  text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:11px;
  transition:transform .12s cubic-bezier(.4,0,.2,1), box-shadow .12s, border-color .15s, background .15s;
  color:var(--text);
  font-family:'Sora',sans-serif;font-size:14px;
  width:100%;
  box-shadow:0 4px 0 rgba(0,0,0,.32);
  transform:translateY(0);
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
.ch:hover:not(:disabled){
  border-color:rgba(245,158,11,.5);
  background:rgba(245,158,11,.07);
  transform:translateY(-1px);
  box-shadow:0 5px 0 rgba(0,0,0,.32);
}
.ch:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:0 1px 0 rgba(0,0,0,.32);
}
.ch.sel{
  border-color:var(--amber);
  background:rgba(245,158,11,.1);
}
.ch.correct{
  border-color:var(--green2);
  background:rgba(16,185,129,.1);
  animation:correctPulse .4s ease;
}
.ch.wrong{
  border-color:var(--red);
  background:rgba(220,38,38,.08);
  animation:wrongShake .35s ease;
}
.ch:disabled{cursor:default}
.ch-lbl{
  width:28px;height:28px;border-radius:50%;
  background:var(--s4);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;color:var(--muted2);
  font-family:'Syne Mono',monospace;
  transition:all .18s;
}
.ch.sel .ch-lbl{background:var(--amber);color:#000}
.ch.correct .ch-lbl{background:var(--green2);color:#fff;box-shadow:0 0 12px rgba(16,185,129,.5)}
.ch.wrong .ch-lbl{background:var(--red);color:#fff}

/* ─── TRUE/FALSE ─── */
.tf-items{display:flex;flex-direction:column;gap:9px}
.tf-row{
  background:var(--s3);border:1px solid var(--border2);
  border-radius:var(--r2);padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.tf-text{font-size:13px;font-weight:500;flex:1;line-height:1.55;color:var(--text)}
.tf-btns{display:flex;gap:7px;flex-shrink:0}
.tf-btn{
  padding:10px 16px;border-radius:8px;
  border:1px solid var(--border2);
  background:var(--s4);
  font-family:'Sora',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;transition:transform .10s,box-shadow .10s,border-color .12s,background .12s;
  color:var(--muted2);letter-spacing:.3px;
  box-shadow:0 3px 0 rgba(0,0,0,.30);
  transform:translateY(0);
  min-height:44px;touch-action:manipulation;
}
.tf-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.30)}
.tf-btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.tf-btn.sel-t{background:rgba(16,185,129,.18);border-color:var(--green2);color:var(--green2)}
.tf-btn.sel-f{background:rgba(220,38,38,.14);border-color:var(--red);color:var(--red)}
.tf-btn.reveal-ok{background:rgba(16,185,129,.18);border-color:var(--green2);color:var(--green2)}
.tf-btn.reveal-err{background:rgba(220,38,38,.14);border-color:var(--red);color:var(--red)}

/* ─── CLASSIFY ─── */
.cat-labels{display:flex;gap:9px;justify-content:center;margin-bottom:12px}
.cat-lbl{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.3px}
.cat0{background:rgba(13,148,136,.14);color:var(--teal2);border:1px solid rgba(13,148,136,.3)}
.cat1{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.28)}
.cl-items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cl-item{
  background:var(--s3);border:2px solid var(--border2);
  border-radius:10px;padding:8px 12px;
  font-size:13px;font-weight:600;color:var(--chalk);
  transition:border-color .2s;
}
.cl-item.ok-item{border-color:var(--green2);box-shadow:0 0 8px rgba(16,185,129,.2)}
.cl-item.err-item{border-color:var(--red)}
.cl-btns{display:flex;gap:5px;margin-top:6px}
.cl-b{
  background:var(--s4);border:1px solid var(--border2);
  border-radius:6px;padding:3px 9px;
  font-size:11px;font-weight:600;cursor:pointer;
  color:var(--muted2);
  transition:transform .10s,box-shadow .10s,border-color .12s,background .12s;
  font-family:'Sora',sans-serif;
  box-shadow:0 3px 0 rgba(0,0,0,.28);
  transform:translateY(0);
}
.cl-b:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.cl-b:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.cl-b.a0{background:rgba(13,148,136,.18);border-color:var(--teal2);color:var(--teal2)}
.cl-b.a1{background:rgba(245,158,11,.16);border-color:var(--amber);color:var(--amber)}
.cl-b.ok0,.cl-b.ok1{background:rgba(16,185,129,.18);border-color:var(--green2);color:var(--green2)}
.cl-b.err0,.cl-b.err1{background:rgba(220,38,38,.12);border-color:var(--red);color:var(--red)}

/* ─── PAIRS ─── */
.pairs-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pair-btn{
  background:var(--s3);border:2px solid var(--border2);
  border-radius:var(--r2);padding:12px 8px;
  text-align:center;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--chalk);
  transition:transform .10s,box-shadow .10s,border-color .15s,background .15s;
  font-family:'Sora',sans-serif;line-height:1.4;
  box-shadow:0 4px 0 rgba(0,0,0,.30);
  transform:translateY(0);
}
.pair-btn:hover:not(:disabled){border-color:var(--amber);background:rgba(245,158,11,.07);transform:translateY(-1px);box-shadow:0 5px 0 rgba(0,0,0,.30)}
.pair-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.30)}
.pair-btn.sel-pair{background:rgba(124,58,237,.2);border-color:var(--violet)}
.pair-btn.matched{background:rgba(16,185,129,.12);border-color:var(--green2);color:var(--green2)}
.pair-btn.mismatch{background:rgba(220,38,38,.1);border-color:var(--red);animation:wrongShake .3s ease}

/* ─── FILL BLANK ─── */
.fill-sentence{font-size:15px;font-weight:600;line-height:2.2;margin-bottom:14px;color:var(--chalk)}
.fill-blank{
  display:inline-block;min-width:80px;
  border-bottom:2px solid var(--amber);
  padding:2px 9px;margin:0 4px;
  color:var(--amber);font-weight:700;text-align:center;
  cursor:pointer;border-radius:4px;
  transition:all .15s;
}
.fill-blank.filled{background:rgba(245,158,11,.1)}
.fill-blank.correct-blank{border-color:var(--green2);color:var(--green2);background:rgba(16,185,129,.1)}
.fill-blank.wrong-blank{border-color:var(--red);color:var(--red);background:rgba(220,38,38,.08)}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.wb-word{
  background:var(--s4);border:2px solid var(--border2);
  border-radius:9px;padding:7px 14px;
  font-size:13px;font-weight:600;cursor:pointer;
  color:var(--chalk);
  transition:transform .10s,box-shadow .10s,border-color .12s,background .12s;
  box-shadow:0 4px 0 rgba(0,0,0,.28);
  transform:translateY(0);
}
.wb-word:hover:not(:disabled){border-color:var(--amber);background:rgba(245,158,11,.08);transform:translateY(-1px);box-shadow:0 5px 0 rgba(0,0,0,.28)}
.wb-word:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.wb-word.used{opacity:.25;cursor:not-allowed;transform:none;box-shadow:none}
.wb-word:disabled{opacity:.25;cursor:not-allowed}

/* ─── SPOT ERROR ─── */
.spot-sentence{font-size:15px;font-weight:500;line-height:2;margin-bottom:13px;color:var(--chalk)}
.spot-word{
  cursor:pointer;border-radius:5px;padding:2px 5px;
  transition:all .15s;border-bottom:2px solid transparent;
  display:inline;
}
.spot-word:hover{background:rgba(245,158,11,.12);border-color:var(--amber)}
.spot-word.selected{background:rgba(124,58,237,.2);border-color:var(--violet);font-weight:700}
.spot-word.correct{background:rgba(220,38,38,.14);border-color:var(--red);color:var(--red)}
.spot-word.wrong{background:rgba(13,148,136,.14);border-color:var(--teal2)}
.spot-none-btn{
  background:var(--s3);border:2px solid var(--border2);
  border-radius:9px;padding:9px 14px;
  font-size:13px;font-weight:600;color:var(--muted2);
  transition:transform .10s,box-shadow .10s,border-color .12s,background .12s;
  width:100%;text-align:center;cursor:pointer;
  font-family:'Sora',sans-serif;margin-top:3px;
  box-shadow:0 4px 0 rgba(0,0,0,.28);
  transform:translateY(0);
}
.spot-none-btn:hover:not(:disabled){border-color:var(--green2);color:var(--green2);transform:translateY(-1px);box-shadow:0 5px 0 rgba(0,0,0,.28)}
.spot-none-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.spot-none-btn.sel-none{border-color:var(--green2);background:rgba(16,185,129,.1);color:var(--green2)}

/* ─── FEEDBACK ─── */
.feedback{
  background:linear-gradient(135deg,var(--s2),var(--s1));
  border-radius:var(--r);
  padding:13px 16px;margin:0 16px 13px;
  border-left:3px solid var(--green2);
  font-size:13px;line-height:1.7;color:var(--chalk);
  animation:fadeUp .28s ease;
  box-shadow:var(--shadow);
}
.feedback.fb-wrong{border-left-color:var(--red)}
.fb-title{font-size:13px;font-weight:700;margin-bottom:5px}
.feedback.fb-wrong .fb-title{color:var(--red)}
.feedback:not(.fb-wrong) .fb-title{color:var(--green2)}

/* ─── ACTION BUTTON ─── */
.action{padding:0 16px 14px}
.btn{
  width:100%;padding:14px;
  border-radius:var(--r);
  font-family:'Sora',sans-serif;
  font-size:15px;font-weight:700;
  border:none;cursor:pointer;
  transition:all .22s cubic-bezier(.4,0,.2,1);
  letter-spacing:.2px;
  touch-action:manipulation;
}
.btn-p{
  background:linear-gradient(135deg,var(--amber) 0%,var(--ember) 100%);
  color:#000;
  box-shadow:0 5px 0 #b45309, 0 8px 20px rgba(245,158,11,.30);
  transform:translateY(0);
}
.btn-p:hover:not(:disabled){
  box-shadow:0 6px 0 #b45309, 0 10px 28px rgba(245,158,11,.40);
  transform:translateY(-1px);
}
.btn-p:active:not(:disabled){
  box-shadow:0 1px 0 #b45309, 0 2px 8px rgba(245,158,11,.25);
  transform:translateY(4px);
}
.btn-p:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.btn-s{
  background:var(--s3);color:var(--text);
  border:1px solid var(--border2);
  box-shadow:0 4px 0 rgba(0,0,0,.35);
  transform:translateY(0);
}
.btn-s:hover:not(:disabled){border-color:var(--amber);color:var(--amber);transform:translateY(-1px);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn-s:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}

/* ─── LEVEL COMPLETE ─── */
.lc-area{padding:36px 20px;text-align:center}
.lc-stars{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.lc-star{font-size:40px;animation:starPop .5s cubic-bezier(.34,1.56,.64,1) both}
.lc-star:nth-child(2){animation-delay:.1s}
.lc-star:nth-child(3){animation-delay:.2s}
.lc-title{
  font-family:'Fraunces',serif;
  font-size:28px;font-weight:900;color:var(--chalk);
  margin-bottom:6px;letter-spacing:-.5px;
}
.lc-sub{font-size:13px;color:var(--muted2);margin-bottom:20px;font-weight:500}
.lc-comment{
  background:linear-gradient(135deg,var(--s2),var(--s1));
  border:1px solid var(--border2);border-left:3px solid var(--amber);
  border-radius:var(--r);padding:14px 18px;margin-bottom:18px;
  font-size:14px;line-height:1.75;color:var(--chalk);
  font-style:italic;text-align:left;box-shadow:var(--shadow);
}
.xp-pill{
  background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(224,123,0,.08));
  border:1px solid rgba(245,158,11,.3);
  border-radius:12px;padding:10px 18px;margin-bottom:16px;
  font-size:15px;font-weight:700;color:var(--amber);
  box-shadow:0 0 20px rgba(245,158,11,.1);
}
.badge-pop{
  background:rgba(245,158,11,.1);border:2px solid rgba(245,158,11,.3);
  border-radius:var(--r);padding:14px;margin-bottom:14px;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
.badge-pop-icon{font-size:32px;margin-bottom:6px}
.badge-pop-txt{font-size:13px;font-weight:700;color:var(--amber)}

/* ─── QUIZ ─── */
.loading-wrap{display:flex;flex-direction:column;align-items:center;padding:52px 20px;gap:16px}
.loading-bob{animation:bob 1.4s ease-in-out infinite}
.loading-txt{
  font-size:14px;color:var(--muted2);text-align:center;
  line-height:1.7;font-style:italic;
}
.dots::after{content:'';animation:dots 1.5s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.err-box{
  background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.22);
  border-radius:var(--r);padding:18px;margin:0 16px;text-align:center;
}
.err-box p{font-size:13px;color:var(--red);line-height:1.65;margin-bottom:13px}

/* ─── SETUP ─── */
.setup-wrap{padding:52px 20px;text-align:center}
.setup-wrap .title{
  font-family:'Fraunces',serif;font-size:28px;font-weight:900;
  color:var(--chalk);margin-bottom:9px;letter-spacing:-.5px;
}
.setup-wrap .sub{font-size:14px;color:var(--muted2);line-height:1.7;margin-bottom:24px}
.api-inp{
  width:100%;padding:14px 16px;
  border-radius:var(--r);
  background:var(--s2);border:2px solid var(--border2);
  color:var(--text);font-family:'Sora',sans-serif;font-size:14px;
  margin-bottom:12px;outline:none;
  transition:border-color .2s;
}
.api-inp:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
.api-inp::placeholder{color:var(--muted)}
.setup-note{font-size:11px;color:var(--muted2);line-height:1.65;margin-top:9px}
.setup-note a{color:var(--teal2)}

/* ─── KEYFRAMES ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pop{0%{transform:scale(.78);opacity:0}65%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes correctPulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}100%{box-shadow:0 0 0 12px rgba(16,185,129,0)}}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg);opacity:0}70%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}

/* ─── TOAST ─── */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--s3);border:1px solid var(--border2);
  border-radius:var(--r);padding:11px 22px;
  font-size:14px;font-weight:600;color:var(--chalk);
  opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);
  pointer-events:none;z-index:200;white-space:nowrap;
  box-shadow:var(--shadow2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── UTILS ─── */
.divider{height:1px;background:var(--border);margin:0 16px 9px}
.section-lbl{
  font-size:10px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;color:var(--muted2);
  padding:0 16px;margin-bottom:10px;
  font-family:'Syne Mono',monospace;
}

/* ─── PROF APOSTROF CHARACTER ─── */
.prof-svg-wrap{
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
/* Body animations — subtle, expression-forward */
.state-idle     .char-body{animation:profFloat   4s   ease-in-out infinite}
.state-thinking .char-body{animation:profFloat   5s   ease-in-out infinite}
.state-happy    .char-body{animation:profNudgeUp .5s  ease-out forwards}
.state-excited  .char-body{animation:profNudgeUp .55s ease-out forwards}
.state-wrong    .char-body{animation:profNudgeDn .45s ease-out forwards}
.state-shocked  .char-body{animation:profPop     .4s  ease-out forwards}

@keyframes profFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
@keyframes profNudgeUp{
  0%  {transform:translateY(0)}
  40% {transform:translateY(-5px)}
  100%{transform:translateY(0)}
}
@keyframes profNudgeDn{
  0%  {transform:translateY(0)}
  35% {transform:translateY(3px)}
  100%{transform:translateY(0)}
}
@keyframes profPop{
  0%  {transform:scale(1)}
  30% {transform:scale(1.03) translateY(-3px)}
  100%{transform:scale(1) translateY(0)}
}
/* Eye blink in idle */
.state-idle #irisL,
.state-idle #irisR{animation:eyeBlink 5s ease-in-out infinite}
@keyframes eyeBlink{
  0%,44%,46%,100%{transform:scaleY(1)}
  45%{transform:scaleY(0.08)}
}
/* State glows */
.state-happy  #profSVG{filter:drop-shadow(0 0 9px rgba(16,185,129,.32))}
.state-excited #profSVG{filter:drop-shadow(0 0 12px rgba(245,158,11,.38))}
.state-wrong  #profSVG{filter:drop-shadow(0 0 8px rgba(220,38,38,.28))}
.state-shocked #profSVG{filter:drop-shadow(0 0 9px rgba(96,165,250,.28))}
/* ─── CONFETTİ ─── */
#confetti-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:9999;
}
.lc-star{animation:starPop .5s cubic-bezier(.34,1.56,.64,1) both}
.lc-star:nth-child(1){animation-delay:.05s}
.lc-star:nth-child(2){animation-delay:.18s}
.lc-star:nth-child(3){animation-delay:.31s}
@keyframes starPop{
  0%{transform:scale(0) rotate(-30deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}
}
/* ─── ZAYIF NOKTALAR PANELİ ─── */
.ws-panel{
  margin:0 16px 16px;
  background:rgba(220,38,38,.06);
  border:1px solid rgba(220,38,38,.18);
  border-radius:var(--r);
  padding:14px 16px;
}
.ws-header{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.ws-icon{font-size:16px}
.ws-title{font-size:13px;font-weight:700;color:var(--chalk);flex:1}
.ws-sub{font-size:10px;color:var(--muted2)}
.ws-item{
  margin-bottom:10px;cursor:pointer;
  padding:8px 10px;border-radius:8px;
  background:rgba(0,0,0,.15);
  transition:background .15s;
}
.ws-item:last-child{margin-bottom:0}
.ws-item:hover{background:rgba(220,38,38,.10)}
.ws-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.ws-item-name{font-size:13px;font-weight:600;color:var(--chalk)}
.ws-count{font-size:11px;font-weight:700;color:#f87171;font-family:'Syne Mono',monospace}
.ws-bar-bg{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-bottom:6px;overflow:hidden}
.ws-bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.ws-item-bot{display:flex;align-items:center;justify-content:space-between}
.ws-topic-tag{font-size:10px;color:var(--muted2);font-family:'Syne Mono',monospace;letter-spacing:.3px}
.ws-retry-btn{
  background:rgba(220,38,38,.18);border:1px solid rgba(220,38,38,.30);
  color:#f87171;font-size:11px;font-weight:700;
  border-radius:6px;padding:3px 9px;cursor:pointer;
  font-family:'Sora',sans-serif;
  box-shadow:0 2px 0 rgba(0,0,0,.25);
  transition:all .15s;
}
.ws-retry-btn:hover{background:rgba(220,38,38,.30);transform:translateY(-1px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ws-retry-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
</style>
</head>

};
let _curProfState = 'idle';

function setSVGState(state) {
  _curProfState = state;
  const s = PROF_STATES[state] || PROF_STATES.idle;
  _morphPath('browL', s.bl, 380);
  _morphPath('browR', s.br, 380);
  // Mouth
  const mel = document.getElementById('mouth');
  if (mel) {
    const ns = 'http://www.w3.org/2000/svg';
    if (s.mt === 'shocked') {
      if (mel.tagName === 'path') {
        const e = document.createElementNS(ns,'ellipse');
        e.id='mouth'; e.setAttribute('cx','90'); e.setAttribute('cy','118');
        e.setAttribute('rx','10'); e.setAttribute('ry','13'); e.setAttribute('fill','#a85030');
        mel.parentNode.replaceChild(e, mel);
      }
    } else {
      if (mel.tagName === 'ellipse') {
        const e = document.createElementNS(ns,'path');
        e.id='mouth'; e.setAttribute('stroke','#a85030'); e.setAttribute('stroke-width','3.2');
        e.setAttribute('fill','none'); e.setAttribute('stroke-linecap','round'); e.setAttribute('d',s.mo);
        mel.parentNode.replaceChild(e, mel);
      } else { _morphPath('mouth', s.mo, 380); }
    }
  }
  _morphAttr('irisL','cx', s.ix[0], 300); _morphAttr('irisR','cx', s.ix[1], 300);
  _morphAttr('irisL','cy', s.iy,    300); _morphAttr('irisR','cy', s.iy,    300);
  if (['happy','wrong','shocked','excited'].includes(state)) {
    setTimeout(() => { if(_curProfState===state) setSVGState('idle'); },
      state==='excited' ? 2200 : 1600);
  }
}
function _morphPath(id, to, ms) {
  const el = document.getElementById(id);
  if (!el || el.tagName!=='path') return;
  const from = el.getAttribute('d'); if (!from||from===to) return;
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min((now-t0)/ms, 1), e = p<.5?2*p*p:-1+(4-2*p)*p;
    const na=(from.match(/-?\d+\.?\d*/g)||[]).map(Number);
    const nb=(to.match(/-?\d+\.?\d*/g)||[]).map(Number);
    let i=0;
    el.setAttribute('d', from.replace(/-?\d+\.?\d*/g,()=>{
      const v=(na[i]||0)+((nb[i]||0)-(na[i]||0))*e; i++;
      return Math.round(v*10)/10;
    }));
    if(p<1) requestAnimationFrame(step);
  })(t0);
}
function _morphAttr(id, attr, to, ms) {
  const el = document.getElementById(id); if(!el) return;
  const from = parseFloat(el.getAttribute(attr))||0;
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min((now-t0)/ms,1), e=1-Math.pow(1-p,3);
    el.setAttribute(attr, from+(to-from)*e);
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde <u>başladı</u> sözcüğündeki yapım ekinin türü diğerlerinden farklıdır?',opts:['Bahçedeki çiçekleri her sabah <u>suladı</u>.','Hava erkenden <u>karardı</u>.','Olayı hemen polise <u>bildirdi</u>.','Bu zorlu hayatı tek başına <u>yaşadı</u>.','Yemeğin tuzu <u>azaldı</u>.'],cor:2,hint:'"başla-, sula-, karar-, yaşa-, azal-" fiillerinin kökleri isim mi fiil mi? Peki "bildir-"in kökü?',exp:'"Başladı" (baş+la), "suladı" (su+la), "karardı" (kara+ar), "yaşadı" (yaş+a), "azaldı" (az+al) sözcükleri isim kökünden fiil türetmiştir (isimden fiil yapım eki). "Bildirdi" ise "bilmek" fiil kökünden "-dir" ekiyle türetilmiştir (fiilden fiil yapım eki). Doğru cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcük yapım eki almamıştır?',opts:['<u>Bilgili</u> insanlar her zaman saygı görür.','<u>Yalnızlık</u> bazen insanı dinlendirir.','<u>Süzgün</u> bakışlarıyla etrafı süzdü.','<u>Sevgisiz</u> bir dünya düşünülemez.','Bahçedeki <u>çiçekleri</u> vazoya koydu.'],cor:4,hint:'"çiçekleri" sözcüğündeki ekler yeni sözcük mü türetiyor, yoksa hâl mi bildiriyor?',exp:'"Çiçekleri" sözcüğündeki "-ler" (çoğul) ve "-i" (belirtme) ekleri çekim ekidir; sözcüğün anlamını değiştiren yapım eki yoktur. Diğerlerinde ise "-li", "-lık", "-gün" ve "-siz" yapım ekleri mevcuttur. Doğru cevap E.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde "sorumluluk" sözcüğünde olduğu gibi birden fazla yapım eki almış bir sözcük kullanılmıştır?',opts:['<u>Öğretmenimiz</u> bugün çok neşeliydi.','<u>Vatandaşlık</u> görevini yerine getirdi.','<u>Sorumlu</u> davranmak hepimizin görevi.','<u>Kitapçıdan</u> yeni bir roman aldım.','<u>Gözcü</u> kulübesinde nöbet tutuyor.'],cor:1,hint:'"vatandaşlık" sözcüğünü hecelerine ayır: vatan+? +?',exp:'"Sorumluluk" (soru+m+lu+luk) sözcüğünde birden fazla yapım eki vardır. "Vatandaşlık" (vatan+daş+lık) sözcüğü de "-daş" ve "-lık" olmak üzere iki yapım eki almıştır. Diğerleri yalnızca bir yapım eki taşır. Doğru cevap B.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde "soru" sözcüğündeki gibi fiilden isim yapım eki almış bir sözcük vardır?',opts:['<u>Kışlık</u> hazırlıkları tamamlandı.','<u>Tuzlu</u> yemekleri pek sevmezdi.','<u>Oduncu</u> ormana doğru yürüdü.','En sevdiği <u>yazı</u> türü hikâyeydi.','<u>Şehirli</u> yaşama ayak uydurdu.'],cor:3,hint:'"soru" sözcüğünün kökü "sor-" fiilidir. Hangi seçenekte aynı durum söz konusu?',exp:'"Soru" sözcüğü "sor-" fiiline "-u" eki gelerek türemiştir (fiilden isim). "Yazı" sözcüğü de "yaz-" fiiline "-ı" eki gelerek oluşmuştur (fiilden isim). Diğer seçeneklerdeki "-lık", "-lu", "-cu", "-li" ekleri isimden isim yapım ekleridir. Doğru cevap D.'},

          {type:'choice5',rule:'<div style="font-size:12px;line-height:1.7;margin-bottom:8px">Uzak Doğu <u>kültürlerinde</u> <u>güler yüzlü</u> olmak sanki bir<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(I)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(II)(III)<br>zorunluluktur. Karşılaştığınız hemen her insanın<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(IV)<br>yüzünde tebessüm <u>görürsünüz</u>.<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(V)</div>',q:'Bu parçadaki numaralanmış sözcüklerin hangisinde fiilden isim yapım eki yoktur?',opts:['I','II','III','IV','V'],cor:4,hint:'"görürsünüz" → gör + -ür (geniş zaman kip eki) + -sünüz (şahıs eki). Yapım eki yok.',exp:'"görürsünüz" (V): gör- + çekim ekleri. Fiilden isim yapım eki yok. kültürlerinde: kültür isim, güler: gül+er (sıfat-fiil, fiilden isim sayılabilir), yüzlü: yüz+lü (isimden isim). V\'te yapım eki yok.'},
          
          
          
          {type:'choice5',rule:'<div style="font-size:12px;line-height:1.7;margin-bottom:8px">Aşağıdaki cümlelerin hangisinde altı çizili sözcük "Peki ya sen nasılsın?" cümlesinin yüklemiyle yapıca özdeşir?</div>',q:'',opts:['<u>Öneriniz</u> aklıma hiç yatmadı.','<u>Göçmen</u> bir komşumuz vardı.','Dışarıda biraz konuşabilir miyiz?','Aslında belli ki bir <u>amacım</u> yoktu.','<u>Özel</u> bir gün olduğunu unuttum.'],cor:2,hint:'"nasılsın" → ne+asıl → birleşik sözcük (birleşik yapıda). "biraz" da öyle mi?',exp:'"nasılsın": ne+asıl birleşmesinden → birleşik yapı. "biraz": bir+az birleşmesi → birleşik. Cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcüğün kökü, türü (isim/fiil) bakımından diğerlerinden farklıdır?',opts:['Küçük çocuğun <u>adımları</u> her geçen gün hızlanıyordu.','Yaşadığı bu zorlu <u>yaşantı</u> onu erkenden olgunlaştırdı.','Gecenin sessizliğini bozan tek şey <u>ışıltı</u> saçan yakamozlardı.','Şairin son kitabındaki <u>dizeler</u> oldukça etkileyiciydi.','<u>Uykucu</u> kedisi günün büyük bir kısmını koltukta geçiriyor.'],cor:1,hint:'"yaşantı" sözcüğünün kökü "yaşamak" fiili mi, yoksa "yaş" ismi mi?',exp:'A: at+ım (fiil kök), C: ışı+l+tı (fiil kök), D: diz+e (fiil kök), E: uyu+ku (fiil kök). B seçeneğinde ise "yaşantı" sözcüğünün kökü "yaş" (ömür/yıl) ismidir. Doğru cevap B.'},
            {type:'choice5',rule:'',q:'Türkçede "-e / -a" eki hem yapım eki hem de çekim eki (yönelme hâl eki) olarak kullanılabilir. Aşağıdaki cümlelerin hangisinde altı çizili sözcükte bu ek, diğerlerinden farklı bir işlevde kullanılmıştır?',opts:['Yolun sonundaki <u>sapa</u> yoldan içeri girdik.','Kitabın bu bölümü tam on <u>dize</u> halinde yazılmış.','Şehrin her yerini <u>çevre</u> kirliliği sarmıştı.','Eskiden bu mahallede <u>gece</u> vakti dışarı çıkılmazdı.','Eşyaları yavaşça <u>göze</u> çarpmayacak bir yere bıraktı.'],cor:4,hint:'A-D seçeneklerinde "-e/-a" yeni sözcük mi türetiyor? E\'deki "göze"de ne oluyor?',exp:'A: sap+a (yapım eki), B: diz+e (yapım eki), C: çevir+e (yapım eki), D: geç+e (yapım eki). E seçeneğinde ise "göz+e" sözcüğündeki "-e" yönelme hâl ekidir (çekim eki). Doğru cevap E.'},
            {type:'choice5',rule:'',q:'Bir sözcük gövde durumuna geldikten sonra en az bir yapım eki daha alırsa "gövdeden türemiş" sayılır. Buna göre aşağıdaki cümlelerin hangisinde gövdeden türemiş bir sözcük yoktur?',opts:['Herkesin içinde <u>bencillik</u> duygusu az da olsa vardır.','Yazarın <u>başlangıç</u> yazısı herkes tarafından beğenildi.','Onun bu <u>duyarlı</u> davranışı herkese örnek oldu.','Okula yeni gelen <u>öğrenciler</u> bahçede toplandı.','Evin <u>kitaplık</u> bölümü oldukça düzenli görünüyordu.'],cor:4,hint:'"kitaplık" kaç yapım eki almış? Gövde aşamasına geçip tekrar yapım eki almış mı?',exp:'A: ben+cil+lik (gövdeden türeme), B: baş+la+ngıç (gövdeden türeme), C: duy+ar+lı (gövdeden türeme), D: öğre+n+ci (gövdeden türeme). E seçeneğinde "kitap+lık" yalnızca bir yapım eki almıştır; gövde durumundadır ama gövdeden türememiştir. Doğru cevap E.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerde yer alan birleşik sözcüklerden hangisinin oluşum yolu diğerlerinden farklıdır?',opts:['Sonbaharda bahçedeki <u>hanımeli</u> çiçekleri döküldü.','Küçük çocukta <u>kuşpalazı</u> hastalığı görülmüş.','Mutfaktaki <u>biçerdöver</u> maketi oldukça ilgi çekiciydi.','Yolun kenarındaki <u>aslanağzı</u> çiçekleri çok güzeldi.','Yeni aldığı <u>ayakkabı</u> ayağını biraz sıkıyordu.'],cor:2,hint:'"biçer" ve "döver" kelimeleri hangi sözcük türüne ait?',exp:'A, B, D ve E seçeneklerindeki birleşik sözcükler "isim+isim" tamlaması yoluyla oluşmuştur. C seçeneğindeki "biçerdöver" ise "biç+er" ve "döv+er" geniş zamanlı iki fiilin birleşmesiyle (fiil+fiil) oluşmuştur. Doğru cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcük, yapısı bakımından (basit, türemiş, birleşik) diğerlerinden farklıdır?',opts:['Balıkların <u>solungaç</u> kısımları temizlenmelidir.','Yolun karşısındaki <u>sıradaki</u> evi almak istiyordu.','Günün sonunda <u>boğazı</u> oldukça fazla ağrımıştı.','Çölde <u>yorucu</u> bir yolculuk onları bekliyordu.','Sınavdan sonra <u>bitkin</u> bir hâlde eve döndü.'],cor:2,hint:'"boğazı" sözcüğünde yapım eki var mı, yoksa yalnızca çekim eki mi?',exp:'A: solu+n+gaç (türemiş), B: sıra+da+ki (türemiş), D: yor+ucu (türemiş), E: bit+gin (türemiş). C seçeneğindeki "boğazı" sözcüğü yalnızca iyelik çekim eki almış basit bir sözcüktür. Doğru cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcük hem yapım eki hem de çekim eki almıştır?',opts:['Toplantıda oldukça <u>seviyeli</u> bir tartışma yaşandı.','Dışarıdaki <u>martıları</u> simit atarak besledik.','Eski dostlarıyla <u>sessizce</u> vedalaşıp gitti.','Bu <u>sorumluluk</u> hepimizin omuzlarındadır.','Onun bu <u>anlayışı</u> herkesi çok şaşırttı.'],cor:4,hint:'"anlayışı" sözcüğünü parçala: kök + yapım eki + çekim eki',exp:'"Anlayışı" sözcüğü: "anla-" (fiil kök) + "-yış" (fiilden isim yapım eki) + "-ı" (iyelik çekim eki). Hem yapım hem çekim eki almıştır. A: seviye+li (yalnızca yapım), D: sorum+lu+luk (yalnızca yapım), C: sessiz+ce (yalnızca yapım). Doğru cevap E.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde "fiilden fiil yapım eki" almış bir sözcük kullanılmıştır?',opts:['Yeni açılan sergi herkes tarafından çok <u>beğenildi</u>.','Güneşli havalarda gökyüzü iyice <u>maviye</u> çalar.','Yazarın <u>korku</u> dolu hikâyeleri çocukları etkiledi.','Evin önündeki bahçeyi rengarenk <u>çiçekler</u> süslemişti.','Bu bölgedeki <u>yolların</u> yapımı nihayet bitti.'],cor:0,hint:'"beğen-" fiiline gelen "-il" eki hangi tür yapım ekidir?',exp:'"Beğenildi" sözcüğü "beğen-" fiiline "-il" fiilden fiil yapım eki (edilgenlik eki) gelerek oluşmuştur. B: mavi+ye (isimden fiil), C: kork+u (fiilden isim), D: çiçek (basit), E: yol+ların (çekim eki). Doğru cevap A.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcük birden fazla yapım eki almıştır?',opts:['<u>Süzgün</u> bakışlarıyla etrafı bir süre izledi.','Olayı <u>kısaca</u> özetleyip toplantıdan ayrıldı.','<u>Öğretmenlik</u> kutsal bir meslek olarak görülür.','<u>Kitapçıdan</u> aldığım romanı bir solukta bitirdim.','<u>Gözcü</u> kulesinde nöbet tutan askerleri gördük.'],cor:2,hint:'"öğretmenlik" sözcüğünü sıfırdan parçala: öğre- + ?',exp:'A: süz+gün (1 yapım eki), B: kısa+ca (1 yapım eki), D: kitap+çı (1 yapım eki), E: göz+cü (1 yapım eki). C seçeneğinde "öğre+t+men+lik" şeklinde üç yapım eki mevcuttur. Doğru cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde birleşik sözcük oluşurken her iki sözcük de anlam kaybına uğramıştır?',opts:['Yol kenarındaki <u>karatavuk</u> kuşlarını izledik.','Deniz kenarında <u>yakamoz</u> oluşumunu seyrettik.','Bahçeye ektiği <u>itburnu</u> bitkisi meyve vermiş.','En sevdiği yemek <u>zeytinyağlı</u> pırasaydı.','<u>Başöğretmen</u> Atatürk\'ün izinden gidiyoruz.'],cor:2,hint:'"it" ve "burun" kelimeleri bu birleşikte kendi anlamlarını koruyor mu?',exp:'"İtburnu" (kuşburnu) sözcüğünü oluşturan "it" ve "burun" kelimeleri kendi asıl anlamlarını tamamen yitirerek bir bitki adı olmuştur. A\'da "kara" renk anlamını korur, B\'de yakamoz kalıplaşmış tekil sözcüktür, D\'de zeytinyağı hâlâ yağdır, E\'de baş öncelik anlamını korur. Doğru cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcüğün kökü, sözcük türü (isim/fiil) bakımından diğerlerinden farklıdır?',opts:['Şehrin <u>çevresi</u> son yıllarda hızla betonlaştı.','Bu bölgedeki <u>yolların</u> bakımı nihayet bitti.','<u>Doğudan</u> gelen rüzgarlar havayı iyice soğuttu.','Yazarın son <u>yazısı</u> büyük bir ilgiyle okundu.','Güneş <u>batıda</u> yavaş yavaş kayboluyordu.'],cor:1,hint:'Hangi seçenekteki sözcüğün kökü fiil değil isimdir?',exp:'A: çevir+e (fiil kök), C: doğ+u (fiil kök), D: yaz+ı (fiil kök), E: bat+ı (fiil kök). B seçeneğinde ise "yol" sözcüğü isim köküdür. Doğru cevap B.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde "-ı, -i, -u, -ü" eki sözcüğe belirtme hâl eki (çekim eki) göreviyle eklenmiştir?',opts:['Onun <u>yazısı</u> sınıftaki herkesten daha güzeldi.','Okulun <u>kapısı</u> rüzgardan dolayı hızla kapandı.','Sabahtan beri aradığım <u>anahtarı</u> masada buldum.','Bu bölgede <u>doğu</u> yönüne gitmek oldukça zordur.','Yemeğin <u>tuzu</u> biraz fazla olduğu için içemedi.'],cor:2,hint:'"anahtarı" sözcüğündeki "-ı" eki nesneyi mi belirtiyor, iyelik mi katıyor?',exp:'A, B, E seçeneklerinde "-ı/-i" eki iyelik (aitlik) ekidir. D seçeneğinde "-u" yapım ekidir (doğ+u). C seçeneğinde ise "anahtar+ı" nesneyi belirten belirtme hâl ekidir (çekim eki). Doğru cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcük hem yapım eki hem de çekim eki almıştır?',opts:['Bize karşı her zaman <u>korkusuzca</u> hareket etti.','Masanın üzerindeki <u>gözlüklerini</u> alıp dışarı çıktı.','Eski mahalledeki <u>simitçi</u> artık buraya gelmiyor.','Yeni açılan <u>sınıflar</u> henüz tam olarak dolmadı.','Öğrenciler ders çıkışında hızlıca <u>gittiler</u>.'],cor:1,hint:'"gözlüklerini" sözcüğünü parçala: göz + ? + ? + ?',exp:'"Gözlüklerini": göz (isim kök) + -lük (yapım eki) + -ler (çoğul çekim) + -i (iyelik çekim) + -n-i (belirtme çekim). Hem yapım hem çekim eki almıştır. A: korkusuz+ca (yalnızca yapım), C: simit+çi (yalnızca yapım), D: sınıf+lar (yalnızca çekim). Doğru cevap B.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde "-de / -da" eki eklendiği sözcüğe yapım eki göreviyle gelerek sözcüğün anlamını değiştirmiştir?',opts:['Kitaplarını okulun <u>sırasında</u> bırakıp kantine gitti.','Hafta sonu <u>yolda</u> mahsur kalanlara yardım ettik.','Sınıfın en <u>gözde</u> öğrencisi olmayı başarmıştı.','Yıllardır aynı <u>şehirde</u> yaşamaktan sıkılmıştı.','Bahçede <u>oyunda</u> olan çocukları içeri çağırdı.'],cor:2,hint:'"gözde"deki "-de" sözcüğü nitelendiriyor mu, yoksa yer mi bildiriyor?',exp:'A, B, D, E seçeneklerinde "-de/-da" bulunma hâl ekidir (çekim eki). C seçeneğinde ise "göz+de" sözcüğünde "-de" eki "seçkin, beğenilen" anlamında yeni bir sıfat türetmiştir (yapım eki). Doğru cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcük birden fazla yapım eki almıştır (gövdeden türemiştir)?',opts:['<u>Yolcular</u> durakta otobüsün gelmesini bekliyordu.','Okula yeni başlayan <u>öğrenciler</u> çok heyecanlıydı.','Onun <u>bencil</u> tavırları arkadaş çevresini daralttı.','Bu işin <u>sorumluluğu</u> tamamen senin üzerindedir.','Duvardaki <u>tabloyu</u> babasına hediye etmek için aldı.'],cor:3,hint:'"sorumluluk" sözcüğünü sıfırdan parçala: sor- + ?',exp:'"Sorumluluğu" sözcüğü: sor+u (1. yapım) → soru+m (2. yapım) → sorum+lu (3. yapım) → sorumlu+luk (4. yapım). Birden fazla yapım eki olduğu için gövdeden türemiştir. A: yol+cu (1 yapım), B: öğren+ci (1 yapım), C: ben+cil (1 yapım). Doğru cevap D.'},
            {type:'choice5',rule:'',q:'Birleşik sözcükler oluşturulurken farklı yollar izlenebilir. Aşağıdaki cümlelerin hangisindeki birleşik sözcük sıfat tamlaması biçiminde oluşmuştur?',opts:['Bahçedeki <u>aslanağzı</u> çiçekleri çok güzel görünüyor.','Akşam yemeğinde <u>imambayıldı</u> yapacağını söyledi.','Bu mahallede pek çok <u>gecekondu</u> yıkılmaya başlandı.','<u>Açıkgöz</u> davranarak sıranın en önüne geçmeyi başardı.','Mutfaktaki <u>buzdolabı</u> gürültülü çalışmaya başladı.'],cor:3,hint:'"açık" hangi sözcük türü? "göz" hangi sözcük türü? Birlikte ne kuruyor?',exp:'A: aslanağzı (isim tamlaması), B: imambayıldı (isim+fiil), C: gecekondu (isim+fiil), E: buzdolabı (isim tamlaması). D seçeneğindeki "açıkgöz" = açık (sıfat) + göz (isim) → sıfat tamlaması biçiminde oluşmuştur. Doğru cevap D.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde altı çizili sözcük çekim eki alırken ünlü düşmesine uğramıştır?',opts:['<u>Uykusuz</u> geçen gecelerin sabahı zor oluyor.','Yolun sonunda <u>kıvrılan</u> bir dereyle karşılaştık.','Salondaki <u>burnu</u> kanayan çocuğa ilk yardımı yaptı.','Onun bu <u>anlayışı</u> hepimizi gerçekten çok şaşırttı.','<u>Sızlayan</u> kolunu ovuşturarak koltuğa oturdu.'],cor:2,hint:'"burun+u" → burun sözcüğü ek alırken değişiyor mu?',exp:'A: uyu+ku (yapım eki alırken düşme), B: kıvır+ıl (yapım eki alırken düşme), D: anla+yış (yapım eki alırken düşme), E: sızı+la (yapım eki alırken düşme). C seçeneğinde "burun+u" → "burnu" — iyelik çekim eki alırken "u" sesi düşmüştür. Doğru cevap C.'},
            {type:'choice5',rule:'',q:'Aşağıdaki dizelerin hangisinde altı çizili sözcük türemiş değil, basit yapılıdır?',opts:['<u>Işığın</u> hızı karanlığı boğmaya yeter mi?','<u>Bakışların</u> hâlâ o eski günleri anlatıyor.','<u>Gülüşün</u> kalbimde silinmez izler bıraktı.','<u>Bilginin</u> gücüyle her engeli aşabilirsin.','Sana gelen bu <u>yolların</u> dönüşü yok artık.'],cor:4,hint:'"yolların" sözcüğünde yeni anlam katan bir ek var mı?',exp:'A: ış+ı+k (türemiş), B: bak+ış (türemiş), C: gül+üş (türemiş), D: bil+gi (türemiş). E seçeneğinde "yol+lar+ın" sözcüğü yalnızca çoğul ve tamlayan çekim ekleri almıştır; yapım eki yoktur, basit bir sözcüktür. Doğru cevap E.'},
            {type:'choice5',rule:'',q:'Aşağıdaki cümlelerin hangisinde "fiilden fiil yapım eki" almış bir sözcük kullanılmıştır?',opts:['Bu bölgedeki ağaçlar sonbaharda iyice <u>sarardı</u>.','Olayı duyunca herkes derin bir <u>korku</u> yaşadı.','Okuduğu kitaplar sayesinde oldukça <u>bilgili</u> biriydi.','Küçük bebek annesinin kucağında hemen <u>uyudu</u>.','Yeni açılan sergi herkes tarafından çok <u>beğenildi</u>.'],cor:4,hint:'"beğen-" fiiline gelen "-il" eki hangi tür yapım ekidir?',exp:'A: sarı+ar (isimden fiil yapım eki), B: kork+u (fiilden isim yapım eki), C: bil+gi+li (fiilden isim + isimden isim). D: uyu+du (çekim eki, yapım eki yok). E: "beğen-" fiil köküne "-il" (edilgenlik — fiilden fiil yapım eki) getirilmiştir. Doğru cevap E.'},

const S={
  screen:'home', // home | stdetail | lesson | quiz
  tid:null, stid:null, lvid:null,
  // lesson
  queue:[], qIdx:0,
  answered:false, correct:null, selected:null,
  clChosen:{}, clChecked:false,
  retries:[],
  pairSel:null, pairMatched:{},
  tfChosen:{}, tfChecked:false,
  spotSel:null, spotNoError:false,
  fillChosen:{},
  // quiz
  quiz:{qs:[],cur:0,answered:false,sel:null,score:0,loading:false,err:null,done:false},
  // persist
  xp:0, streak:0, lastPlay:null,
  done:{}, // {stid_lvid: score or true}
  badges:new Set(), newBadges:[],
  wrongLog:{}, // {stid: count} — kümülatif yanlış sayısı
  apiKey:'',
};

function ls(k,v){if(v===undefined)return localStorage.getItem('profv3_'+k);localStorage.setItem('profv3_'+k,v)}
function loadState(){
  S.xp=parseInt(ls('xp')||'0'); S.streak=parseInt(ls('streak')||'0');
  S.lastPlay=ls('lp')||null; S.done=JSON.parse(ls('done')||'{}');
  S.badges=new Set(JSON.parse(ls('bdg')||'[]')); S.apiKey=ls('ak')||'';
  S.wrongLog=JSON.parse(ls('wl')||'{}');
  checkStreak();
}
function saveState(){ls('xp',S.xp);ls('streak',S.streak);ls('lp',S.lastPlay);ls('done',JSON.stringify(S.done));ls('bdg',JSON.stringify([...S.badges]));ls('wl',JSON.stringify(S.wrongLog))}
function checkStreak(){const t=new Date().toDateString(),y=new Date(Date.now()-86400000).toDateString();if(!S.lastPlay){S.streak=1;S.lastPlay=t;saveState();}else if(S.lastPlay===y){S.streak++;S.lastPlay=t;saveState();}}
function markPlay(){const t=new Date().toDateString();if(S.lastPlay!==t){S.lastPlay=t;saveState();}}
function getLv(){for(let i=LEVELS.length-1;i>=0;i--)if(S.xp>=LEVELS[i].min)return{...LEVELS[i],idx:i};return{...LEVELS[0],idx:0}}
function getXPpct(){const lv=getLv();const nx=LEVELS[lv.idx+1];if(!nx)return 100;return Math.min(100,Math.round(((S.xp-lv.min)/(nx.min-lv.min))*100))}
function addXP(n){S.xp+=n;saveState();}
function recordWrong(){
  if(!S.stid) return;
  S.wrongLog[S.stid]=(S.wrongLog[S.stid]||0)+1;
  ls('wl',JSON.stringify(S.wrongLog));
}
function award(id){if(!S.badges.has(id)){S.badges.add(id);S.newBadges.push(id);saveState();}}
function getTopic(){return TOPICS.find(t=>t.id===S.tid)}
function getST(){return getTopic()?.subtopics.find(s=>s.id===S.stid)}
function getLV(){return getST()?.levels.find(l=>l.id===S.lvid)}
function doneKey(stid,lvid){return `${stid}_${lvid}`}
function isDone(stid,lvid){return S.done[doneKey(stid,lvid)]!==undefined}
function isLvUnlocked(st,lvid){
  const idx=st.levels.findIndex(l=>l.id===lvid);
  if(idx===0)return true;
  return isDone(st.id, st.levels[idx-1].id);
}
function isSTUnlocked(topic,stid){
  const idx=topic.subtopics.findIndex(s=>s.id===stid);
  if(idx===0)return true;
  const prev=topic.subtopics[idx-1];
  return prev.levels.every(l=>isDone(prev.id,l.id));
}

// SES EFEKTLERİ (Web Audio API — dosya gerektirmez)
// ═══════════════════════════════════════════════════════
const SFX = (() => {
  let ctx = null;
  let muted = (localStorage.getItem('profv3_sfx') === 'off');

  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Temel ton çalıcı: type=sine/square/triangle, freq, dur (sn), vol, delay
  function tone(freq, dur, vol=0.18, type='sine', delay=0) {
    if (muted) return;
    try {
      const c = ac();
      const o = c.createOscillator();
      const g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = type;
      o.frequency.setValueAtTime(freq, c.currentTime + delay);
      g.gain.setValueAtTime(0, c.currentTime + delay);
      g.gain.linearRampToValueAtTime(vol, c.currentTime + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + dur);
      o.start(c.currentTime + delay);
      o.stop(c.currentTime + delay + dur + 0.05);
    } catch(e) {}
  }

  function chord(notes, dur, vol, type='sine') {
    notes.forEach(([f, d]) => tone(f, d ?? dur, vol, type));
  }

  return {
    isMuted: () => muted,
    toggle() {
      muted = !muted;
      localStorage.setItem('profv3_sfx', muted ? 'off' : 'on');
      return muted;
    },

    // ── Doğru cevap: tatlı iki nota ──
    correct() {
      tone(523, 0.12, 0.15, 'sine', 0);
      tone(783, 0.18, 0.13, 'sine', 0.10);
    },

    // ── Yanlış cevap: yumuşak düşen ton ──
    wrong() {
      tone(330, 0.08, 0.14, 'sine', 0);
      tone(246, 0.22, 0.12, 'sine', 0.07);
    },

    // ── Level tamamlama: küçük fanfar ──
    levelDone() {
      [[523,0.10],[659,0.10],[783,0.10],[1046,0.25]].forEach(([f,d], i) => {
        tone(f, d, 0.14, 'sine', i * 0.11);
      });
    },

    // ── Bölüm tamamlama (daha etkileyici) ──
    topicDone() {
      [[523,0.10],[659,0.10],[784,0.10],[1046,0.10],[784,0.10],[1046,0.35]].forEach(([f,d], i) => {
        tone(f, d, 0.15, 'sine', i * 0.10);
      });
      // Alt akoru eşliği
      tone(261, 0.60, 0.06, 'sine', 0);
    },

    // ── Buton tıklama: hafif tık ──
    tap() {
      tone(880, 0.04, 0.06, 'sine', 0);
    },

    // ── XP kazanma: ince parlama ──
    xp() {
      tone(1046, 0.06, 0.07, 'sine', 0);
      tone(1318, 0.09, 0.06, 'sine', 0.05);
    },

    // ── AI quiz doğru ──
    quizCorrect() {
      tone(659, 0.10, 0.13, 'sine', 0);
      tone(880, 0.10, 0.11, 'sine', 0.09);
      tone(1046, 0.18, 0.10, 'sine', 0.18);
    },

    // ── Streak / streak kaybı ──
    streak() {
      tone(880, 0.06, 0.12, 'sine', 0);
      tone(1174, 0.10, 0.11, 'sine', 0.07);
    },
  };
})();

// CONFETTİ SİSTEMİ (Canvas tabanlı, sıfır bağımlılık)
// ═══════════════════════════════════════════════════════
const CONFETTI = (() => {
  let canvas, ctx, particles = [], raf = null;

  // Renk paletleri
  const PALETTES = {
    level:  ['#f59e0b','#fbbf24','#10b981','#34d399','#60a5fa','#a78bfa','#f472b6'],
    topic:  ['#fbbf24','#f59e0b','#ff6b35','#10b981','#6366f1','#ec4899','#ffffff','#34d399'],
  };

  // Konfeti parçacığı fabrikası
  function makeParticle(palette, x) {
    const color = palette[Math.floor(Math.random() * palette.length)];
    const shape = Math.random() < 0.6 ? 'rect' : Math.random() < 0.5 ? 'circle' : 'ribbon';
    return {
      x: x ?? (Math.random() * (canvas?.width || window.innerWidth)),
      y: -12,
      vx: (Math.random() - 0.5) * 5,
      vy: Math.random() * 3 + 2,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 8,
      w: shape === 'ribbon' ? 3 : Math.random() * 8 + 5,
      h: shape === 'ribbon' ? Math.random() * 16 + 8 : Math.random() * 8 + 5,
      color,
      shape,
      alpha: 1,
      gravity: 0.08 + Math.random() * 0.06,
      drag: 0.99,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: Math.random() * 0.05 + 0.02,
    };
  }

  function ensureCanvas() {
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'confetti-canvas';
      document.body.appendChild(canvas);
    }
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx = canvas.getContext('2d');
  }

  function tick() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const alive = [];
    for (const p of particles) {
      p.wobble += p.wobbleSpeed;
      p.x  += p.vx + Math.sin(p.wobble) * 0.8;
      p.y  += p.vy;
      p.vy += p.gravity;
      p.vx *= p.drag;
      p.rot += p.rotV;
      // Fade out near bottom
      if (p.y > canvas.height * 0.75) p.alpha -= 0.025;

      if (p.y < canvas.height + 20 && p.alpha > 0) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        if (p.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.shape === 'ribbon') {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();
        alive.push(p);
      }
    }
    particles = alive;
    if (particles.length > 0) {
      raf = requestAnimationFrame(tick);
    } else {
      raf = null;
      if (canvas) { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    }
  }

  function burst(count, palette, originX) {
    ensureCanvas();
    const cx = originX ?? canvas.width / 2;
    for (let i = 0; i < count; i++) {
      // Spread: some near center, some spread wide
      const spread = (Math.random() - 0.5) * canvas.width * 0.6;
      particles.push(makeParticle(palette, cx + spread));
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  return {
    // Level tamamlama: orta-üstten tek dalga
    level() {
      burst(70, PALETTES.level);
    },

    // Bölüm/konu tamamlama: iki dalga, daha yoğun
    topic() {
      burst(90, PALETTES.topic);
      setTimeout(() => burst(70, PALETTES.topic), 350);
    },

    // Hızlı küçük patlama (AI quiz perfect skoru gibi)
    mini() {
      burst(40, PALETTES.level);
    },

    stop() {
      particles = [];
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  };
})();

function renderTF(ex){
  const done=S.tfChecked;
  return `<div class="tf-items">${ex.items.map((item,i)=>{
    const chosen=S.tfChosen[i]; // 't' or 'f'
    const correct=item.cor;

    if(done){
      tCls=correct?(chosen==='t'?'sel-t':'reveal-ok'):(chosen==='t'?'reveal-err':'');
      fCls=!correct?(chosen==='f'?'sel-f':'reveal-ok'):(chosen==='f'?'reveal-err':'');

  }).join('')}</div>`;

function renderClassify(ex){
  const done=S.clChecked;
  // Derive short labels: last word of each cat name avoids "Ünsüz/Ünsüz" duplicates
  const lbl0 = ex.cats[0].split(' ').pop();
  const lbl1 = ex.cats[1].split(' ').pop();
  return `<div>

function renderPairs(ex){
  const total=ex.leftItems.length;
  const allMatched=Object.keys(S.pairMatched).length===total;
  // Shuffle right column — use seeded order stored in state so it doesn\'t re-shuffle on every render
  if(!S.pairRightOrder||S.pairRightOrder.length!==ex.rightItems.length){
    const order=ex.rightItems.map((_,i)=>i).sort(()=>Math.random()-.5);
    S.pairRightOrder=order;
  }
  const rightShuffled=S.pairRightOrder.map(i=>({text:ex.rightItems[i],origIdx:i}));
  return `<div class="pairs-grid">
${ex.leftItems.map((l,i)=>{
  const matched=S.pairMatched[i]!==undefined;
  const cls=matched?'matched':S.pairSel===`l${i}`?'sel-pair':'';
  return `<button class="pair-btn ${cls}" ${matched?'disabled':''} onclick="pickPairLeft(${i})">${l}</button>`;
}).join('')}
${rightShuffled.map((r,i)=>{
  const matchedBy=Object.entries(S.pairMatched).find(([li,ri])=>ri===r.origIdx);
  const cls=matchedBy?'matched':S.pairSel===`r${r.origIdx}`?'sel-pair':'';
  return `<button class="pair-btn ${cls}" ${matchedBy?'disabled':''} onclick="pickPairRight(${r.origIdx})">${r.text}</button>`;
}).join('')}
</div>
${allMatched?`<div class="feedback" style="margin-top:8px"><div class="fb-title">✅ Tümü eşleşti!</div>${ex.exp}</div>`:''}`;
}

function renderFillBlank(ex){
  const done=Object.keys(S.fillChosen).length===ex.blanks.length && (S.answered||S.clChecked);
  let sIdx=0;
  const parts=ex.sentence.split('____');
  let html=parts.map((p,i)=>{
    let blankhml='';
    if(i<ex.blanks.length){
      const chosen=S.fillChosen[i];
      const correct=S.answered&&chosen===ex.blanks[i].answer;
      const wrong=S.answered&&chosen&&chosen!==ex.blanks[i].answer;
      blankhml=`<span class="fill-blank ${chosen?'filled':''} ${correct?'correct-blank':wrong?'wrong-blank':''}" onclick="${S.answered?'':'removeFill('+i+')'}">${chosen||'_____'}</span>`;
    }
    return p+blankhml;
  }).join('');
  const usedWords=Object.values(S.fillChosen);
  return `<div class="fill-sentence">${html}</div>
<div class="word-bank">${ex.bank.map((w,i)=>{
  const used=usedWords.includes(w);
  return `<button class="wb-word ${used?'used':''}" ${used||S.answered?'disabled':''} onclick="pickFill('${w}')">${w}</button>`;
}).join('')}</div>`;
}

function renderSpotError(ex){
  if(!ex.sentence)return '';
  const done=S.answered||S.clChecked;
  let wordsHtml='';
  if(ex.words){
    // Fix: use word index in onclick to avoid apostrophe/quote escaping issues
    wordsHtml=ex.words.map((w,i)=>{
      const isSel=S.spotSel===w;
      const isCorrect=done&&ex.errorWord&&w===ex.errorWord;
      const isWrong=done&&isSel&&ex.errorWord&&w!==ex.errorWord;
      return `<span class="spot-word ${isSel?'selected':''} ${isCorrect?'correct':''} ${isWrong?'wrong':''}" ${done?'':` onclick="pickSpotIdx(${i})"`}>${w}</span> `;
    }).join('');
  } else {
    wordsHtml=`<span>${ex.sentence}</span>`;
  }
  return `<div class="spot-sentence">${wordsHtml}</div>
<button class="spot-none-btn ${S.spotNoError?'sel-none':''}" ${done?'disabled':''} onclick="pickSpotNone()">✓ Hata Yok</button>`;

<div class="err-box"><p>${Q.err}</p><button class="btn btn-p" onclick="startAIQuiz()">Tekrar Dene</button></div>`;
  if(Q.done)return renderQuizComplete();
  if(!Q.qs.length)return '';
  const q=Q.qs[Q.cur]; const labels=['A','B','C','D','E'];
  const total=Q.qs.length; const pSt=!Q.answered?'idle':Q.sel===q.dogru?'happy':'shocked';
  return `${renderTopBar()}
<div style="display:flex;align-items:center;gap:10px;padding:13px 18px">
<div class="back-btn" style="padding:0" onclick="goSTDetail()">← Geri</div>
<div class="lesson-prog" style="flex:1">
<div class="lesson-bar"><div class="lesson-fill" style="width:${Math.round((Q.cur/total)*100)}%;background:linear-gradient(90deg,var(--heat),var(--gold))"></div></div>
<div class="lesson-step">${Q.cur+1} / ${total}</div>
</div>
<div style="font-size:11px;font-weight:700;background:rgba(255,107,53,.14);border:1px solid rgba(255,107,53,.3);border-radius:20px;padding:3px 9px;color:var(--heat)">KPSS</div>
</div>
<div style="display:flex;justify-content:center;margin:3px 0">${prof(pSt,72,82)}</div>
<div class="q-card" style="margin-top:6px">
<div class="q-text">${q.soru}</div>
<div class="choices">${labels.map(o=>{const val=q[o];if(!val)return '';let cls='';if(Q.answered){if(o===q.dogru)cls='correct';else if(o===Q.sel)cls='wrong';}else if(o===Q.sel)cls='sel';return `<button class="ch ${cls}" ${Q.answered?'disabled':''} onclick="pickQuiz('${o}')"><div class="ch-lbl">${o}</div><span>${val}</span></button>`;}).join('')}
</div></div>
${Q.answered?`<div class="feedback ${Q.sel!==q.dogru?'fb-wrong':''}">
<div class="fb-title">${Q.sel===q.dogru?'✅ Doğru!':'❌ Doğru: '+q.dogru}</div>${q.aciklama}</div>`:''}
<div class="action">
${Q.answered
  ?`<button class="btn btn-p" onclick="nextQuiz()">${Q.cur<total-1?'Sonraki →':'🏁 Sonuçları Gör'}</button>`
  :`<button class="btn btn-p" ${Q.sel?'':'disabled'} onclick="confirmQuiz()">Yanıtla</button>`
}
</div>`;
}

function renderQuizComplete(){
  const st=getST(); const lvData=getLV(); const score=S.quiz.score; const total=S.quiz.qs.length;
  const perfect=score===total;
  const key=doneKey(st.id,S.lvid);
  const isNew=S.done[key]===undefined;
  if(isNew){addXP(lvData.xp+(perfect?50:0));S.done[key]=score;saveState();if(perfect)award('perfect');}
  // Confetti + ses sadece ilk renderda
  if(isNew){
    setTimeout(()=>{
      if(perfect){ SFX.topicDone(); CONFETTI.topic(); }
      else if(score>=3){ SFX.levelDone(); CONFETTI.level(); }
    }, 200);
  }
  const c={
    5:'BEŞ ÜSTÜNDEN BEŞ! Birecik balcan kebabı mısın mübarek!',
    4:'Dört! Bir soru kaçtı ama o tuzaktı zaten. Talha hoca da aynı fikirde.',
    3:'Üç. Yeterli ama RF anten gibi hassasiyet lazım. Tekrar yap.',
    2:'İki. Bu konu biraz daha çalışma istiyor. Corolla\'yı düşün, o da sabır gerektiriyordu.',
    1:'Bir. Öğren moduna dön, yeniden gel. Annen "olmaz" demedi hiç, sen de deme.',
    0:'Sıfır. Panik yok. Dedeni düşün — emekli polis, teslim olmadı hiç. Sen de olmayacaksın.'
  };
  const nb=S.newBadges.splice(0);
  const nextLV=st.levels.find((l,i)=>i>0&&st.levels[i-1].id===S.lvid);
  return `<div class="lc-area" style="animation:fadeUp .4s ease">
<div style="display:flex;justify-content:center;margin-bottom:8px">${prof(score>=3?'excited':'shocked',80,90)}</div>
<div style="font-family:'Fraunces',serif;font-size:64px;font-weight:900;color:var(--gold);line-height:1;text-align:center">${score}/${total}</div>
<div style="font-size:12px;color:var(--muted);text-align:center;margin:4px 0 14px">${st.title} — ${lvData.label}</div>
<div class="lc-comment">"${c[score]||c[0]}"</div>
${isNew?`<div class="xp-pill">+${lvData.xp+(perfect?50:0)} XP 🏆</div>`:''}
${nb.map(id=>{const b=BADGES.find(x=>x.id===id);return b?`<div class="badge-pop"><div class="badge-pop-icon">${b.i}</div><div class="badge-pop-txt">${b.l}</div></div>`:''}).join('')}
<div style="display:flex;flex-direction:column;gap:9px">
<button class="btn btn-p" onclick="startAIQuiz()">🔄 Tekrar Yap</button>
${nextLV?`<button class="btn btn-p" style="background:linear-gradient(135deg,var(--violet),#6d28d9)" onclick="startLevel('${nextLV.id}')">→ ${nextLV.label}</button>`:''}
<button class="btn btn-s" onclick="goSTDetail()">Konuya Dön</button>
</div></div>`;
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function goHome(){S.screen='home';R()}
function goSTDetail(){S.screen='stdetail';R()}
function toggleSFX(){SFX.toggle();R();}
function goST(tid,stid){S.tid=tid;S.stid=stid;S.screen='stdetail';R()}

function startLevel(lvid){
  const st=getST();
  const lv=st.levels.find(l=>l.id===lvid);
  if(!lv)return;
  S.lvid=lvid;
  if(lv.isAI){S.screen='quiz';resetQuiz();R();startAIQuiz();return;}
  // build queue
  // Build queue — shuffle classify items so answer pattern isn\'t predictable
  S.queue=lv.exercises.map(ex=>{
    if(ex.type==='classify'){
      const shuffled=[...ex.items].sort(()=>Math.random()-.5);
      return {ex:{...ex, items:shuffled}, isRetry:false};
    }
    return {ex, isRetry:false};
  });
  S.qIdx=0; S.retries=[];
  resetQ();
  S.screen='lesson';R();
}

function resetQ(){
  S.answered=false;S.correct=null;S.selected=null;
  S.clChosen={};S.clChecked=false;
  S.tfChosen={};S.tfChecked=false;
  S.pairSel=null;S.pairMatched={};S.pairRightOrder=null;
  S.spotSel=null;S.spotNoError=false;
  S.fillChosen={};
}

function resetQuiz(){
  S.quiz={qs:[],cur:0,answered:false,sel:null,score:0,loading:true,err:null,done:false};
}

// ═══════════════════════════════════════════════════════
// INTERACTIONS — LESSON
// ═══════════════════════════════════════════════════════
function pickChoice(i){
  if(S.answered)return;
  const ex=S.queue[S.qIdx].ex;
  S.selected=i; S.answered=true; S.correct=i===ex.cor;
  if(!S.correct){S.retries.push({ex,isRetry:true}); SFX.wrong(); recordWrong();}
  else{addXP(4); SFX.correct();}
  markPlay();R();
}

function pickTF(i,v){
  if(S.tfChecked)return;
  S.tfChosen={...S.tfChosen,[i]:v};
  R();
  const ex=S.queue[S.qIdx].ex;
  const btn=document.getElementById('ck');
  if(btn)btn.disabled=!allTFdone(ex);
}
function allTFdone(ex){return ex.items.every((_,i)=>S.tfChosen[i]!==undefined)}
function checkTF(){
  const ex=S.queue[S.qIdx].ex;
  const allOk=ex.items.every((item,i)=>(S.tfChosen[i]==='t')===item.cor);
  S.tfChecked=true;S.correct=allOk;
  if(!allOk){S.retries.push({ex,isRetry:true}); SFX.wrong(); recordWrong();}
  else{addXP(4); SFX.correct();}
  markPlay();R();
}

function pickCL(idx,cat){
  if(S.clChecked)return;
  S.clChosen={...S.clChosen,[idx]:cat};R();
  const ex=S.queue[S.qIdx].ex;
  const btn=document.getElementById('ck');
  if(btn)btn.disabled=!allCLdone(ex);
}
function allCLdone(ex){return ex.items.every((_,i)=>S.clChosen[i]!==undefined)}
function checkCL(){
  const ex=S.queue[S.qIdx].ex;
  const allOk=ex.items.every((item,i)=>S.clChosen[i]===item.c);
  S.clChecked=true;S.correct=allOk;
  if(!allOk){S.retries.push({ex,isRetry:true}); SFX.wrong(); recordWrong();}
  else{addXP(4); SFX.correct();}
  markPlay();R();
}

function pickPairLeft(i){
  if(S.pairMatched[i]!==undefined)return;
  if(S.pairSel&&S.pairSel.startsWith('r')){
    const ri=parseInt(S.pairSel.slice(1));
    const ex=S.queue[S.qIdx].ex;
    const correct=ex.answers[i]===ri;
    if(correct){
      S.pairMatched={...S.pairMatched,[i]:ri};
      S.pairSel=null;
      SFX.tap();
      if(Object.keys(S.pairMatched).length===ex.leftItems.length){
        S.answered=true;S.correct=true;addXP(4);markPlay();SFX.correct();
      }
    } else {
      SFX.wrong(); recordWrong();
      S.pairSel=`l${i}`;
      const btn=document.querySelector(`button[onclick="pickPairRight(${ri})"]`);
      if(btn){btn.classList.add('mismatch');setTimeout(()=>{btn.classList.remove('mismatch');S.pairSel=null;R()},600);}
    }
  } else {S.pairSel=`l${i}`;}
  R();
}
function pickPairRight(ri){
  if(Object.values(S.pairMatched).includes(ri))return;
  if(S.pairSel&&S.pairSel.startsWith('l')){
    const li=parseInt(S.pairSel.slice(1));
    const ex=S.queue[S.qIdx].ex;
    const correct=ex.answers[li]===ri;
    if(correct){
      S.pairMatched={...S.pairMatched,[li]:ri};
      S.pairSel=null;
      SFX.tap();
      if(Object.keys(S.pairMatched).length===ex.leftItems.length){
        S.answered=true;S.correct=true;addXP(4);markPlay();SFX.correct();
      }
    } else {
      SFX.wrong(); recordWrong();
      const btn=document.querySelector(`button.pair-btn.sel-pair`);
      S.pairSel=null;
    }
  } else {S.pairSel=`r${ri}`;}
  R();
}

function pickFill(word){
  if(S.answered)return;
  const ex=S.queue[S.qIdx].ex;
  // find first empty blank
  for(let i=0;i<ex.blanks.length;i++){
    if(!S.fillChosen[i]){
      S.fillChosen={...S.fillChosen,[i]:word};break;
    }
  }
  R();
  const btn=document.getElementById('ck');
  if(btn)btn.disabled=!allFillDone(ex);
}
function removeFill(i){
  if(S.answered)return;
  const newChosen={...S.fillChosen};
  delete newChosen[i];S.fillChosen=newChosen;R();
}
function allFillDone(ex){return ex.blanks.every((_,i)=>S.fillChosen[i]!==undefined)}
function checkFill(){
  const ex=S.queue[S.qIdx].ex;
  const allOk=ex.blanks.every((b,i)=>S.fillChosen[i]===b.answer);
  S.answered=true;S.correct=allOk;
  if(!allOk){S.retries.push({ex,isRetry:true}); SFX.wrong(); recordWrong();}
  else{addXP(4); SFX.correct();}
  markPlay();R();
}

// pickSpotIdx: index-based selection — avoids apostrophe/quote issues in onclick
function pickSpotIdx(i){
  const ex=S.queue[S.qIdx].ex;
  if(!ex||!ex.words)return;
  pickSpotWord(ex.words[i]);
}
function pickSpotWord(w){
  if(S.answered||S.clChecked)return;
  S.spotSel=w;S.spotNoError=false;R();
  const btn=document.getElementById('ck');
  if(btn)btn.disabled=false;
}
function pickSpotNone(){
  if(S.answered||S.clChecked)return;
  S.spotNoError=!S.spotNoError;S.spotSel=null;R();
  const btn=document.getElementById('ck');
  if(btn)btn.disabled=!S.spotNoError;
}
function checkSpot(){
  const ex=S.queue[S.qIdx].ex;
  let correct;
  if(ex.noError){correct=S.spotNoError;}
  else{correct=S.spotSel===ex.errorWord;}
  S.answered=true;S.correct=correct;
  if(!correct){S.retries.push({ex,isRetry:true}); SFX.wrong(); recordWrong();}
  else{addXP(4); SFX.correct();}
  markPlay();R();
}

function nextQ(){
  S.qIdx++;
  resetQ();
  if(S.qIdx>=S.queue.length&&S.retries.length>0){
    S.queue=[...S.queue,...S.retries];
    S.retries=[];
  }
  R();
}

// ═══════════════════════════════════════════════════════
// INTERACTIONS — QUIZ
// ═══════════════════════════════════════════════════════
function pickQuiz(opt){if(S.quiz.answered)return;S.quiz.sel=opt;R()}
function confirmQuiz(){
  if(!S.quiz.sel)return;
  const q=S.quiz.qs[S.quiz.cur];
  S.quiz.answered=true;
  if(S.quiz.sel===q.dogru){S.quiz.score++;addXP(12); SFX.quizCorrect();}
  else{ SFX.wrong(); recordWrong(); }
  markPlay();R();
}
function nextQuiz(){
  if(S.quiz.cur<S.quiz.qs.length-1){S.quiz.cur++;S.quiz.answered=false;S.quiz.sel=null;R();}
  else{S.quiz.done=true;R();}
}

async function startAIQuiz(){
  const lv=getLV();
  S.quiz={qs:[],cur:0,answered:false,sel:null,score:0,loading:true,err:null,done:false};
  R();
  const sys=`Sen KPSS Türkçe uzman soru yazarısın. Gamze Özdin "Türkçenin Matematiği Dil Bilgisi" kitabının metodolojisiyle soru yaz.

KURALLAR:
1. Tam KPSS sınav kalitesi — 5 şık (A-E), tek net doğru cevap
2. Zorluk kademeli: 1-2. soru temel → 3. orta → 4-5. zor ve tuzaklı
3. Tuzak şıklar: öğrencilerin en çok yaptığı yanlışlar üzerine
4. Açıklama: kısa, keskin, "aha" anı yaratan
5. ${lv.aiMode==='karma'?'Birden fazla ses olayını kapsayan, birbirini sınayan sorular yaz.':'Sadece bu konunun farklı alt noktalarını test et, tekrar etme.'}
6. Konu: ${lv.quizKonu}

SADECE JSON array döndür, başka hiçbir şey, backtick YOK:
[{"soru":"...","A":"...","B":"...","C":"...","D":"...","E":"...","dogru":"B","aciklama":"..."}]`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','x-api-key':S.apiKey},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,system:sys,messages:[{role:'user',content:'5 KPSS sorusu üret.'}]})
    });
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`Hata ${r.status}`);}
    const d=await r.json();
    const raw=d.content[0].text.trim().replace(/```json|```/g,'').trim();
    const qs=JSON.parse(raw);
    if(!Array.isArray(qs)||qs.length<3)throw new Error('Format hatası.');
    S.quiz.qs=qs;S.quiz.loading=false;R();
  }catch(e){S.quiz.loading=false;S.quiz.err=`Bağlantı sorunu 😅<br><small>${e.message}</small>`;R();}
}
